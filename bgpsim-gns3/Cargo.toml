[package]
name = "bgpsim-gns3"
version = "0.5.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bgpsim = { path = "../bgpsim/bgpsim", features = ["export", "rand", "topology_zoo"]}
rustify = { version = "0.5.3", features = ["blocking"] }
rustify_derive = "0.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.1.2", features = ["serde"] }
thiserror = "1.0.35"
getset = "0.1.2"
serde_with = "2.0.1"
telnet = "0.2.1"
itertools = "0.10.5"
regex = "1.6.0"
lazy_static = "1.4.0"
ipnet = { version = "2.5.0", features = ["serde"] }
log = "0.4.17"
geoutils = "0.5.1"
ordered-float = "3.2.0"
rand = "0.8.4"
graph-layout = "0.0.1"
anyhow = "1.0"
time = { version = "0.3.15", features = ["serde", "local-offset"] }

# Dependencies for the parsing feature
bgpkit-parser = { version = "0.10.11", optional = true, default-features = false, features = ["parser"] }
byteorder = { version = "1.5.0", optional = true }
bytes = { version = "1.8.0", optional = true }
etherparse = { version = "0.16.0", optional = true }
mac_address = { version = "1.1.5", optional = true }
pcap-file = { version = "2.0.0", optional = true }
range-set = { version = "0.0.11", optional = true }

# Dependencies for the logging feature
chrono = { version = "0.4.40", optional = true }

[features]
parsing = [
    "bgpkit-parser",
    "byteorder",
    "bytes",
    "etherparse",
    "mac_address",
    "pcap-file",
    "range-set",
]
logging = [
    "chrono"
]

[dev-dependencies]
env_logger = "0.9.1"
function_name = "0.3.0"
net-parser-rs = "0.3.0"
pretty-hex = "0.3.0"
pretty_assertions = "1.3.0"
test-log = "0.2.11"
