[Server]
host = 0.0.0.0
port = 3080
images_path = /opt/gns3/images
projects_path = /opt/gns3/projects
appliances_path = /opt/gns3/appliances
configs_path = /opt/gns3/configs
# Must live under /opt/gns3 as well. gns3server asks the *host* Docker daemon to bind-mount this
# directory into each router node at /gns3 (it holds init.sh and busybox). Because /opt/gns3 is
# bind-mounted from the host at the identical path, the daemon resolves it to the same files the
# server sees. A named volume or a differing path breaks node startup with
# `stat /gns3/init.sh: no such file or directory`.
resources_path = /opt/gns3/resources
report_errors = False
auth = False
